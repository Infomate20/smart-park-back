spring.application.name: smart-park
server:
  port: ${SERVER_PORT:8082}

# Aucun secret dans ce fichier : il est versionné.
# Les valeurs sensibles viennent des variables d'environnement, ou du fichier
# .env local (ignoré par git) importé ci-dessous. Voir .env.example.
# Les secrets n'ont volontairement pas de valeur par défaut : une variable
# manquante empêche le démarrage plutôt que de laisser filer une configuration
# incomplète.
spring:
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartpark}
    username: ${DB_USERNAME:smartpark}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Une base déjà en service (construite par ddl-auto) est marquée au niveau
    # V1 sans que V1 ne s'exécute ; seules V2 et suivantes lui sont appliquées.
    # Sur une base vierge, Flyway déroule tout depuis V1.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Schema initial repris de ddl-auto
  jpa:
    hibernate:
      # Le schéma appartient désormais à Flyway. Hibernate se contente de
      # vérifier que les entités correspondent, et refuse de démarrer sinon.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
   smartPark:
     smart_park:
       security: DEBUG
   root: INFO
   com:
     SmartPark.smart_park: INFO
     zaxxer:
       hikari: ERROR
   org:
     springframework:
       web: DEBUG
       security: DEBUG
     hibernate:
       SQL: DEBUG
       type:
         descriptor:
           sql:
             BasicBinder: TRACE
       boot:
         web:
           embedded:
             tomcat: INFO
app:
  cors:
    # Origines autorisées, séparées par des virgules. Seule autorité en matière
    # de CORS : les contrôleurs ne portent plus de @CrossOrigin.
    # allowCredentials étant actif, la valeur '*' est interdite.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

jwt:
  # Clé de signature : obligatoire, sans valeur par défaut. Un défaut ici
  # signerait les jetons de toutes les installations avec la même clé.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:86400000}


